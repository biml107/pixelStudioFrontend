<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- Basic -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />

    <!-- Favicon -->
   <link
  rel="icon"
  type="image/png"
  href="%PUBLIC_URL%/favicon.png"
/>

<link
  rel="shortcut icon"
  href="%PUBLIC_URL%/favicon.ico"
/>

<link
  rel="apple-touch-icon"
  href="%PUBLIC_URL%/favicon.png"
/>

    <!-- SEO -->
    <title>
      Pixcel Studio - Wedding Photographer & Videography in Bokaro
    </title>

    <meta
      name="description"
      content="Pixcel Studio is a wedding photography and cinematic videography studio serving Bokaro, Chas and nearby areas of Jharkhand. We offer wedding photography, pre-wedding shoots, candid photography, drone photography and event photography."
    />

    <meta name="author" content="Pixcel Studio" />

    <meta name="robots" content="index, follow" />

    <link
      rel="canonical"
      href="https://www.pixcelstudio.in/"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />

    <meta
      property="og:title"
      content="Pixcel Studio - Wedding Photography & Videography in Bokaro"
    />

    <meta
      property="og:site_name"
      content="Pixcel Studio"
    />

    <meta
      property="og:description"
      content="Professional wedding photography, pre-wedding shoots and cinematic videography in Bokaro and Chas."
    />

    <meta
      property="og:url"
      content="https://www.pixcelstudio.in/"
    />

    <meta
      property="og:image"
      content="https://www.pixcelstudio.in/Images/companylogo/companylogo3.jpeg"
    />

    <meta
      property="og:locale"
      content="en_IN"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Pixcel Studio - Wedding Photography & Videography in Bokaro"
    />

    <meta
      name="twitter:description"
      content="Professional wedding photography, pre-wedding shoots and cinematic videography in Bokaro and Chas."
    />

    <meta
      name="twitter:image"
      content="https://www.pixcelstudio.in/Images/companylogo/companylogo3.jpeg"
    />

    <!-- Manifest -->
    <link
      rel="manifest"
      href="%PUBLIC_URL%/manifest.json"
    />

    <!-- Local Business Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "Pixcel Studio",
        "url": "https://www.pixcelstudio.in/",
        "logo": "https://www.pixcelstudio.in/Images/companylogo/companylogo3.jpeg",
        "image": "https://www.pixcelstudio.in/Images/companylogo/companylogo3.jpeg",
        "telephone": "+91-9534404424",
        "description": "Pixcel Studio provides wedding photography, pre-wedding photography, cinematic videography, candid photography, drone photography and event photography in Bokaro, Chas and nearby areas of Jharkhand.",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Bokaro",
          "addressRegion": "Jharkhand",
          "addressCountry": "IN"
        },
        "sameAs": [
          "https://www.instagram.com/pixcelstudio.in/",
          "https://www.facebook.com/profile.php?id=61552905053299"
        ]
      }
    </script>

    <!-- Website Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Pixcel Studio",
        "alternateName": "PixcelStudio",
        "url": "https://www.pixcelstudio.in/"
      }
    </script>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>

    <div id="root"></div>
  </body>
</html>
